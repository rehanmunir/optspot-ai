<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>OPTSPOT AI</title>
<style>
/* ══ palette ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#060a12; --bg2:#0a1020; --panel:#0c1322; --line:#1b2740;
  --ink:#e9eff9; --dim:#7c8ca8; --faint:#4b5a75;
  --cyan:#3fd8ff; --magenta:#ff53d4; --amber:#ffc23a;
  --water:#4fb2ff; --foam:#f2f8ff; --chrome:#a8bad2;
  --ok:#3ee08c; --err:#ff6060;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1200px 700px at 50% -10%,#122140 0%,var(--bg2) 45%,var(--bg) 100%);
  color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ══ shell ════════════════════════════════════════════════════════════════ */
#app{display:grid;grid-template-columns:minmax(0,1fr) 336px;grid-template-rows:auto 1fr auto;
     height:100%;max-width:100vw;overflow:hidden}
#top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:10px 16px;
     border-bottom:1px solid var(--line);background:rgba(8,13,24,.72);backdrop-filter:blur(8px)}
/* The scene is absolutely positioned so its intrinsic size can never drive
   layout. As a flex/grid item an <svg> contributes its own aspect-derived
   width as an automatic minimum, which pushed the 1fr column wider than the
   viewport and clipped the right-hand stations off screen in any narrow
   window. Taking it out of flow makes the container size the scene, never the
   other way round. */
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#side{border-left:1px solid var(--line);background:rgba(10,16,28,.72);display:flex;
      flex-direction:column;min-height:0}
#bot{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:7px 16px;
     border-top:1px solid var(--line);background:rgba(8,13,24,.72);
     font:11px/1.5 var(--mono);color:var(--faint);flex-wrap:wrap}

/* ══ header ═══════════════════════════════════════════════════════════════ */
.brand{font-weight:700;letter-spacing:.16em;font-size:13px;text-transform:uppercase;
       background:linear-gradient(90deg,var(--cyan),var(--magenta));
       -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.stat{display:flex;align-items:baseline;gap:6px;font:11px/1 var(--mono);color:var(--dim)}
.stat b{font-size:16px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.spacer{flex:1}
#sess{background:#0d1626;color:var(--dim);border:1px solid var(--line);border-radius:999px;
       padding:4px 9px;font:11px/1 var(--mono);max-width:230px;cursor:pointer}
#sess:hover{color:var(--ink)}
#sess.pinned{color:var(--cyan);border-color:#1f4a63}
.conn{display:inline-flex;align-items:center;gap:7px;font:11px/1 var(--mono);
      padding:5px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.conn.ok{color:var(--ok);border-color:#12472f}
.conn.ok .dot{background:var(--ok);box-shadow:0 0 9px var(--ok)}
.conn.off{color:var(--amber);border-color:#4a3a12}
.conn.off .dot{background:var(--amber)}
.conn.demo{color:var(--magenta);border-color:#4a1440}
.conn.demo .dot{background:var(--magenta)}

/* ══ side panel ═══════════════════════════════════════════════════════════ */
#side h4{margin:0;padding:11px 14px;font:11px/1 var(--mono);letter-spacing:.14em;
         text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);
         display:flex;justify-content:space-between;align-items:center}
#rows{overflow-y:auto;flex:1;padding:4px 0;scrollbar-width:thin}
#scene text{font-family:var(--mono)}
#scene text.sans{font-family:var(--sans)}
#rows::-webkit-scrollbar{width:8px}
#rows::-webkit-scrollbar-thumb{background:#1b2740;border-radius:4px}
#counter{padding:12px 14px;border-bottom:1px solid var(--line)}
#counter h4{margin:0 0 8px;padding:0;font:11px/1 var(--mono);letter-spacing:.14em;
            text-transform:uppercase;color:var(--dim);border:0}
#ask-form{display:flex;flex-direction:column;gap:6px}
#ask-in{width:100%;box-sizing:border-box;background:#0d1626;border:1px solid var(--line);
        border-radius:8px;padding:8px 10px;color:var(--ink);font:12px/1.5 var(--sans);
        resize:vertical;min-height:38px;max-height:180px}
#ask-in:focus{outline:none;border-color:#1f4a63}
#ask-in::placeholder{color:var(--faint)}
#ask-row{display:flex;align-items:center;gap:6px}
#ask-row select{background:#0d1626;color:var(--dim);border:1px solid var(--line);
                border-radius:7px;padding:4px 7px;font:10px/1 var(--mono);cursor:pointer}
#ask-row select:hover{color:var(--ink)}
#ask-row .spacer{flex:1}
#ask-go{background:#123a4d;color:var(--cyan);border:1px solid #1f4a63;border-radius:8px;
        padding:7px 13px;font:11px/1 var(--mono);letter-spacing:.08em;cursor:pointer;
        transition:background .2s,transform .12s}
#ask-go:hover:not(:disabled){background:#16465d}
#ask-go:active:not(:disabled){transform:scale(.96)}
#ask-in{transition:border-color .2s}
#ask-go:disabled,#ask-in:disabled{opacity:.45;cursor:default}
#convo{margin-top:9px;display:flex;flex-direction:column;gap:7px;max-height:300px;
       overflow-y:auto;scrollbar-width:thin}
#convo:empty{display:none}
.bub{border-radius:9px;padding:8px 10px;font:12px/1.55 var(--sans);
     overflow-wrap:break-word;white-space:pre-wrap}
.bub.you{background:#12203a;color:var(--dim);border:1px solid var(--line);
         font-size:11.5px;align-self:flex-end;max-width:92%}
.bub.claude{background:#0d1626;border:1px solid var(--line);color:var(--ink)}
.bub.err{border-color:#4a1f26;color:#ffb3b3}
.bub.wait{color:var(--dim);font:11px/1.5 var(--mono)}
.bub .meta{display:block;margin-top:6px;font:10px/1 var(--mono);color:var(--faint)}
.bub .meta button{background:none;border:0;color:var(--faint);cursor:pointer;
                  font:10px/1 var(--mono);padding:0;text-decoration:underline}
.bub .meta button:hover{color:var(--cyan)}
#ticket{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
#ticket h4{margin:0 0 8px;padding:0;font:11px/1 var(--mono);letter-spacing:.14em;
           text-transform:uppercase;color:var(--dim);border:0}
#tk1{font:600 13px/1.4 var(--sans);color:var(--ink);min-height:18px}
#tk2,#tk3{font:11px/1.5 var(--mono);color:var(--dim)}
#tk4{font:10px/1.5 var(--mono);color:var(--faint);margin-top:2px}
#addons{margin-top:9px;display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font:10px/1 var(--mono);
      padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--faint);
      transition:color .25s,border-color .25s,transform .18s}
.chip.hot{transform:translateY(-1px)}
.chip .dot{font-size:8px}
.chip.used{color:var(--dim)}
.chip.hot{color:var(--cyan);border-color:#1f4a63}
.chip .cnt{color:var(--dim);font-variant-numeric:tabular-nums}
.ev{display:grid;grid-template-columns:12px 62px 1fr auto;gap:8px;align-items:baseline;
    padding:5px 14px;font:11px/1.45 var(--mono);border-bottom:1px solid rgba(27,39,64,.4)}
.ev .s{font-size:9px;line-height:1.6}
.ev .who{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tool{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tool i{color:var(--faint);font-style:normal}
.ev .ms{color:var(--faint);font-variant-numeric:tabular-nums}
.s-run{color:var(--cyan);animation:pulse 1.1s ease-in-out infinite}
.s-done{color:var(--ok)} .s-err{color:var(--err)} .s-note{color:var(--magenta)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.empty{padding:16px 14px;font:11px/1.6 var(--mono);color:var(--faint)}
.empty b{color:var(--dim);font-weight:600}

/* ══ footer ═══════════════════════════════════════════════════════════════ */
#bot .k{color:var(--dim)}
#bot .sep{color:#243350}

@media (prefers-reduced-motion:reduce){ .s-run{animation:none;opacity:.8} }
/* The stage is wide (four big tunnel stages plus three staffed zones), so it
   needs room before the side panel is worth its width. */
@media (max-width:1180px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr 190px auto}
  #top,#bot{grid-column:1}
  #side{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:680px){
  #top{flex-wrap:wrap;row-gap:6px}
}
</style>
</head>
<body>

<div id="app">
  <header id="top">
    <span class="brand">OPTSPOT AI</span>
    <span class="stat"><b id="s-wash">0</b> washing</span>
    <span class="stat"><b id="s-crew">0</b> crew</span>
    <span class="stat"><b id="s-queue">0</b> queued</span>
    <span class="stat"><b id="s-done">0</b> finished</span>
    <span class="spacer"></span>
    <select id="sess" title="which Claude session this wash is following"></select>
    <span class="conn" id="conn"><span class="dot"></span><span id="conn-t">starting…</span></span>
  </header>

  <main id="stage"><svg id="scene" viewBox="0 0 1760 625" preserveAspectRatio="xMidYMid meet" role="img" aria-label="OPTSPOT AI — a car wash where each car is a task and each washer is a Claude agent"></svg></main>

  <aside id="side">
    <div id="counter">
      <h4>The Counter</h4>
      <form id="ask-form">
        <textarea id="ask-in" maxlength="4000" rows="2" autocomplete="off"
          placeholder="give Claude a job — watch it get washed&#10;⏎ to send · ⇧⏎ for a new line"></textarea>
        <div id="ask-row">
          <select id="ask-model" title="model">
            <option value="">default model</option>
            <option value="fable">fable</option>
            <option value="opus">opus</option>
            <option value="sonnet">sonnet</option>
            <option value="haiku">haiku</option>
          </select>
          <select id="ask-effort" title="effort level">
            <option value="">default effort</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
          <span class="spacer"></span>
          <button id="ask-go" type="submit">ask</button>
        </div>
      </form>
      <div id="convo"></div>
    </div>
    <div id="ticket">
      <h4>Ticket</h4>
      <div id="tk1">—</div>
      <div id="tk2"></div>
      <div id="tk3"></div>
      <div id="tk4"></div>
      <div id="addons"></div>
    </div>
    <h4>Activity <span id="side-n" style="color:var(--faint)"></span></h4>
    <div id="rows"><p class="empty">Waiting for the first event…</p></div>
  </aside>

  <footer id="bot">
    <span><span class="k">car</span> = one tool call</span><span class="sep">·</span>
    <span><span class="k">ticket</span> = one turn</span><span class="sep">·</span>
    <span><span class="k">washer</span> = one agent</span><span class="sep">·</span>
    <span>a car leaves clean only when its call really completes</span>
    <span class="spacer"></span>
    <span id="f-seed"></span>
  </footer>
</div>

<script>
"use strict";
/* OPTSPOT AI — Claude Code's own agents and tool calls, live, as a car wash.

   A car is ONE TOOL CALL: it enters when the call starts, washes at its
   family's stage exactly as long as the call really runs, and leaves clean
   only when the call completes. A failed call leaves still dirty. The turn is
   the TICKET — Josh opens it at your prompt, Levi closes it at turn end. A
   washer is one agent. Jets run iff a real call is in flight — that is the
   whole truth channel, and syncTruth() is its only writer.

   House rules, all deliberate:
   - the car advances only on evidence, never on time; only turn.ended (or a
     terminal actor event) makes it clean
   - no progress bar, no percentage: the stream cannot know how much of a
     turn remains, so the page never claims to
   - a quiet session is an empty forecourt, and that is honest
   - state (feed drain, lamps, HUD) runs on its own timer; only motion runs
     on requestAnimationFrame, which stops dead in hidden tabs */

/* ── CONFIG — every tunable, no magic literals below ─────────────── */
const C = Object.freeze({
  DT_CLAMP: 0.1,
  // lane geometry (viewBox units)
  VB_W: 1760, VB_H: 625,
  LANE_Y: 430,                       // ground line the cars sit on
  TUNNEL_X0: 280, TUNNEL_X1: 1220,   // 4 stages × 235
  STATION_W: 235,
  PARK_X: 1830,                      // off-stage right
  CAR_SCALE: 1.1, BAY_CAR_SCALE: .62,
  // motion
  ROLL_SPEED: 300,                   // px/s the car eases at
  // The conveyor: a live car's position is 1-exp(-age/CREEP_TAU) of the way
  // to the hold line. It shows how long the call has RUN — never how close it
  // is to done — and only the real completion event crosses the line.
  CREEP_TAU: 5.5,
  ARRIVE_EPS: 1.2, WHEEL_R: 11,
  BAY_LINGER: 2.2,
  // Per-car outro dwells: towel, goodbye, and the same dwell for a rejected
  // car on its way out. These run only AFTER a call's own terminal event —
  // never during work, where a timer would be inventing progress. (Two other
  // timers exist and neither moves a car: the state pump, and the bay-teardown
  // linger in closeBay.)
  DRY_T: 1.2, BYE_T: 0.9,
  // grime → shine. Real completions thin it; only turn.ended clears it.
  GRIME_START: .92, GRIME_FLOOR: .24, GRIME_K: 5.0,
  // particles
  POOL: 150, EMIT_HZ: 34,
  // feed
  FEED_BUDGET: 8, FEED_Q_MAX: 2000, ROWS_MAX: 200, ROWS_SHOWN: 60,
  HUD_HZ: 5,
  BAYS: 6
});

const QS      = new URLSearchParams(location.search);
const DEBUG   = QS.get('debug') === '1';
const REDUCED = QS.get('reduced') === '1'
  ? { matches: true }
  : (window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false });

/* ── RNG — seeded so a replay is reproducible ────────────────────── */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const SEED = (function(){
  const raw = QS.get('seed');
  if (raw !== null){ const n = Number(raw); if (Number.isFinite(n) && n >= 0) return (n >>> 0); }
  return (Date.now() >>> 0);
})();
const rng      = mulberry32(SEED);
const rnd      = (a,b) => a + (b - a) * rng();
const hashStr  = s => { let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619);} return h >>> 0; };

/* ── CLOCK ───────────────────────────────────────────────────────── */
const CLOCK = { t:0, step(dt){ const d = Math.min(dt, C.DT_CLAMP); this.t += d; return d; }, now(){ return this.t; } };

/* ── WORLD — the wash itself ─────────────────────────────────────── */
/* Stations are ordered. A car's stage index RISES only on a real call of a
   later family; AIR DRY is entered by the exit ride after turn.ended, and by
   nothing else. */
/* FOUR stages — the ones a real tunnel has: water, soap, rollers, air.
   The stream's tool families group naturally onto the first three:
     WATER POUR   reading & searching — soaking the task
     SOAP & FOAM  writing & editing — laying the new material on
     ROLLERS      commands & partner services — scrubbing it all over
     AIR DRY      the ride out — reachable only by a call really completing
   Every live car rides the chain through all of them, position showing how
   long its call has run; the arch above it fires while it is underneath. */
const STATIONS = [
  { id:'water', n:'WATER POUR',  sub:'soaking — reading & searching',  jet:'pour',  gear:'pipes'   },
  { id:'soap',  n:'SOAP & FOAM', sub:'lathering — writing & editing',  jet:'foam',  gear:'cannon'  },
  { id:'roll',  n:'ROLLERS',     sub:'scrubbing — commands & services',jet:'scrub', gear:'rollers' },
  { id:'air',   n:'AIR DRY',     sub:'exit ride — turn complete',      jet:'air',   gear:'blower'  }
];
STATIONS.forEach((s, i) => {
  s.i = i;
  s.x0 = C.TUNNEL_X0 + i * C.STATION_W;
  s.x1 = s.x0 + C.STATION_W;
  s.cx = s.x0 + C.STATION_W / 2;
  s.passes = 0; s.ms = 0;            // real counters, filled from real durations
});

/* ── THE FOUR PHASES OF A TURN, and who is on each ────────────────────────
   The tunnel is only the middle of the story. A turn also has a beginning
   (Claude reading the job before it touches a single tool) and an end (the
   turn genuinely over, results handed back). Each phase has one member of
   staff, and each is entered on a real signal:

     CHECK-IN   Josh    prompt received, and NO tool call has run yet.
                        This is thinking, and it is evidenced rather than
                        guessed: the turn is open and liveN is 0.
     TUNNEL     Nick    a tool call is in flight — the four stages.
     TOWEL      Jeremy  `turn.ended` fired. Towel dry and vacuum the inside:
                        the work is done and the car is being finished off.
     GOODBYE    Levi    the ticket is read back and the customer leaves.

   Josh and Nick are driven purely by events. Jeremy and Levi run on a timer,
   but ONLY after a real `turn.ended` — an outro for something that genuinely
   happened, never a claim about work still in progress. */
const STAFF = {
  josh:   { id:'josh',   name:'Josh',   role:'Check-in',       suit:'#ffc23a', cap:'#5c4210' },
  nick:   { id:'nick',   name:'Nick',   role:'Tunnel',         suit:'#3fd8ff', cap:'#0f4d63' },
  jeremy: { id:'jeremy', name:'Jeremy', role:'Towel & interior', suit:'#3ee08c', cap:'#12472f' },
  levi:   { id:'levi',   name:'Levi',   role:'Goodbye',        suit:'#ff53d4', cap:'#5a1246' }
};
const ZONES = {
  CHECKIN: { id:'CHECKIN', x0:40,   x1:250,  staff:'josh',   n:'CHECK-IN',
             sub:'welcome — reading the job' },
  DRY:     { id:'DRY',     x0:1250, x1:1480, staff:'jeremy', n:'TOWEL & INTERIOR',
             sub:'towel dry · vacuum inside' },
  BYE:     { id:'BYE',     x0:1505, x1:1715, staff:'levi',   n:'GOODBYE',
             sub:'thanks — see you next time' }
};
for (const k in ZONES){ const z = ZONES[k]; z.cx = (z.x0 + z.x1) / 2; }

/* tool → station. First match wins. A tool that matches nothing does NOT move
   the car: we will not guess a stage we have no evidence for. */
const TOOL_STATION = [
  [/^(Read|NotebookRead|TaskOutput|TaskGet|TaskList|Grep|Glob|ToolSearch|WebFetch|WebSearch)$/, 0],
  [/^(Write|Edit|NotebookEdit|MultiEdit)$/,                                                    1],
  [/^(Bash|BashOutput|KillShell)$|^mcp__/,                                                     2]
  // stage 3 (AIR DRY) is the exit ride: reachable from turn.ended and nowhere
  // else. Plan/wrap-up tools are checklist work — an add-on, not a wash stage.
];
const stationFor = t => { for (const r of TOOL_STATION) if (r[0].test(t)) return r[1]; return -1; };
const underArch  = (c, i) => c.x >= STATIONS[i].x0 - 18 && c.x <= STATIONS[i].x1 + 18;

/* Add-on services: real tools that are not a wash stage. Calling in extra
   crew, keeping the checklist, and asking the customer all happen *beside*
   the tunnel. Everything unrecognised joins them rather than being guessed

const ADDONS = [

  { id:'ask',  n:'CUSTOMER OK', re:/^(AskUserQuestion)$/ },

];

for (let i = 0; i < C.BAYS; i++){

/* ── CREW — who is holding the wand ──────────────────────────────── */
const CREW = [
  { id:'ace',   name:'Ace',   role:'Lead',       suit:'#3fd8ff', cap:'#0f4d63' },
  { id:'scout', name:'Scout', role:'Walk-around',suit:'#3ee08c', cap:'#12472f' },

const crewById = {}; CREW.forEach(c => crewById[c.id] = c);
const LEAD = 'ace';
const AGENT_CREW = {
  'Explore':'scout', 'explore':'scout', 'Plan':'iris', 'plan':'iris',
  'general-purpose':'dex', 'claude':'dex', 'code-reviewer':'vera',
  'statusline-setup':'milo', 'output-style-setup':'milo'

function crewFor(type, label){

  if (AGENT_CREW[t]) return crewById[AGENT_CREW[t]];
  const pool = CREW.filter(c => c.id !== LEAD);
  return pool[hashStr(t + '|' + (label || '')) % pool.length];
}

/* Vehicle shapes — variety only, never meaning. An exotic rolling in says
   nothing about the call it carries; it is just a nicer day at the wash. */
const KINDS   = ['sedan','hatch','suv','van','coupe','wagon'];

                 '#d4af6a','#1e5c45','#3b2a6d','#4a4f58','#c1121f'];

/* ── CARS ────────────────────────────────────────────────────────── */
let carSeq = 0;
function makeCarModel(opts){
  const seedN = hashStr('car' + (++carSeq) + SEED);
  return {
    id: 'car' + carSeq,
    kind:  opts.kind  || ((seedN >>> 5) % 100 < 28
             ? EXOTICS[seedN % EXOTICS.length]
             : KINDS[seedN % KINDS.length]),
    paint: opts.paint || PAINT[(seedN >>> 3) % PAINT.length],
    label: opts.label || '',
    station: opts.station != null ? opts.station : -1,
    x: opts.x, targetX: opts.x,
    grime: C.GRIME_START, washed: 0,
    vx: 0, wheelA: 0, wobble: (seedN % 628) / 100,
    settle: 0, hop: 0, launch: 0, antA: 0, antV: 0,
    startedAt: Date.now(), endedAt: 0,
    // lane car: WASH · RINSE · DRYING · BYE · REJECT · LEAVING · GONE
    state: opts.state || 'WASH',
    tool: opts.tool || '',
    rig: null, bay: null
  };
}
function shineFor(grime){
  if (grime <= 0) return '1';
  return (0.45 * (1 - grime / C.GRIME_START)).toFixed(3);
}
// bay cars only: their grime thins with completed calls and plateaus
function regrime(car){
  car.grime = C.GRIME_FLOOR + (C.GRIME_START - C.GRIME_FLOOR) * Math.exp(-car.washed / C.GRIME_K);
}

/* One car per call; one ticket per turn.

   A car exists exactly as long as its tool call: it enters on tool.started,
   washes at its family's stage while the call is in flight, and leaves CLEAN
   only on tool.finished — the completion is the evidence. A failed call skips
   the towel and leaves as dirty as it came. Parallel calls are simply several
   cars in the tunnel at once, which is what they really are.

   The ticket is the turn: Josh opens it on your prompt, the cars stream
   through it, Levi closes it on turn.ended. Nothing here needs a high-water
   mark or a touch-up crew any more — every car's whole life is evidenced. */
/* One wash shows ONE session. Every local Claude Code session feeds the same
   server — the hooks are user-wide — so without this they merged into a
   single imaginary Claude: shared crew, shared ticket, and one session's
   `turn.ended` finishing another session's still-running car.

   So each session keeps its own shadow here, the scene renders whichever is
   focused, and the wash follows the newest session automatically until you
   pick one from the header (after which it stays where you put it). */
const SESSIONS = {};
let FOCUS = null, FOCUS_PINNED = false;

function sessOf(sid){
  return SESSIONS[sid] || (SESSIONS[sid] = {
    sid, label: '', lastAt: Date.now(), washed: 0,
    live: {},              // tool_use_id -> {tool, si, startedAt}
    subs: {},              // agent_id    -> {type, label}
    turn: { open:false, startedAt:0, spawned:0, washed:0, failed:0, queue:0 }
  });
}

/* Fold an event into a session we are NOT showing — enough to keep its
   counters honest and to rebuild its forecourt the moment you switch. */
function shadowApply(ss, e){
  const d = e.d || {};
  switch (e.t){
    case 'session.started': ss.label = d.cwd_name || ss.label; break;
    case 'prompt.submitted':
      if (ss.turn.open) ss.turn.queue++;
      else { ss.turn = { open:true, startedAt:Date.now(), spawned:0, washed:0,
                         failed:0, queue:ss.turn.queue }; }
      break;
    case 'turn.ended':
      ss.turn.open = false; ss.live = {};
      if (ss.turn.queue > 0){ ss.turn.queue--; ss.turn.open = true; }
      break;
    case 'actor.spawned':
      if (d.kind === 'subagent') ss.subs[e.a] = { type:d.agent_type || '', label:d.label || '' };
      break;
    case 'actor.updated':
      if (ss.subs[e.a]) ss.subs[e.a].label = d.label || ss.subs[e.a].label;
      break;
    case 'actor.stopped': delete ss.subs[e.a]; break;
    case 'tool.started': {
      if (d.spawns || e.a !== 'main') break;
      const si = stationFor(d.tool);
      if (si < 0) break;
      if (!ss.turn.open){ ss.turn.open = true; ss.turn.startedAt = Date.now(); }
      ss.live[d.id] = { tool:d.tool, si, startedAt:Date.now() };
      ss.turn.spawned++;
      break;
    }
    case 'tool.finished': case 'tool.failed': {
      if (e.a !== 'main' || !ss.live[d.id]) break;
      delete ss.live[d.id];
      if (e.t === 'tool.finished'){ ss.turn.washed++; ss.washed++; }
      else ss.turn.failed++;
      break;
    }
  }
}

/* Pack the focused session back into its shadow before we look away. */
function stow(){
  if (FOCUS == null) return;
  const ss = sessOf(FOCUS);
  ss.live = {};
  for (const tid in CARS){
    const c = CARS[tid];
    ss.live[tid] = { tool:c.tool, si:c.station, startedAt:c.startedAt };
  }
  ss.subs = {};
  for (const k in FEED.actors){
    const a = FEED.actors[k];
    if (a.kind === 'subagent') ss.subs[k] = { type:a.type, label:a.label };
  }
  ss.turn = { open:TURN.open, startedAt:TURN.startedAt, spawned:TURN.spawned,
              washed:TURN.washed, failed:TURN.failed, queue:TURN.queue };
  ss.washed = SESSION.washed;
}

/* Clear the forecourt and rebuild it as the incoming session left it. */
function setFocus(sid){
  if (sid === FOCUS) return;
  stow();
  FOCUS = sid;
  const ss = sessOf(sid);

  for (const c of WORLD.cars.slice()){          // nobody else's cars linger
    if (c.bay) continue;
    SCENE.unmountLaneCar(c);
    WORLD.cars.splice(WORLD.cars.indexOf(c), 1);
  }
  for (const k in CARS) delete CARS[k];
  for (const k in FEED.actors){
    const a = FEED.actors[k];
    if (a.bay != null) FEED.closeBay(a, true);   // quiet: not a completion
  }
  FEED.actors = {}; FEED.main = null;

  Object.assign(TURN, ss.turn, { lastSummary:null });
  SESSION.washed = ss.washed;

  // put its in-flight calls and subagents back on stage
  FEED.claim('main', 'main', '', ss.label || sid.slice(0, 6));
  for (const tid in ss.live){
    const L = ss.live[tid];
    const car = spawnCallCar(tid, L.tool, L.si);
    car.startedAt = L.startedAt;                 // keep its true age
    FEED.actors['main'].tools[tid] = L.tool;
    FEED.actors['main'].liveN++;
  }
  for (const aid in ss.subs) FEED.claim(aid, 'subagent', ss.subs[aid].type, ss.subs[aid].label);
  HUD.dirty = true; HUD.sessDirty = true;
}
/* The focused session's live state. The shadows above hold every other
   session; these three are what the scene is drawn from. */
const TURN    = { open:false, startedAt:0, spawned:0, washed:0, failed:0,
                  queue:0, lastSummary:null };
const SESSION = { washed:0 };
const CARS    = {};                       // tool_use_id -> live call car
const WORLD   = { cars:[], sparkleAt:0 }; // every mounted car, for paint()

function openTurn(){
  TURN.open = true; TURN.startedAt = Date.now();
  TURN.spawned = 0; TURN.washed = 0; TURN.failed = 0;
  // stage counters describe THIS ticket
  for (const st of STATIONS){ st.passes = 0; st.ms = 0; }
  HUD.dirty = true;
}

function closeTurn(){
  if (!TURN.open) return;
  TURN.open = false;
  // turn.ended is terminal evidence: any call still open at this instant is
  // over as far as the stream can ever know, so its car finishes clean.
  for (const tid in CARS) finishCallCar(tid, true, 0);
  TURN.lastSummary = { washed: TURN.washed, failed: TURN.failed,
                       secs: Math.max(0, Math.round((Date.now() - TURN.startedAt) / 1000)) };
  if (TURN.queue > 0){ TURN.queue--; openTurn(); }
  HUD.dirty = true;
}

function spawnCallCar(tid, tool, si){
  if (!TURN.open) openTurn();               // connected mid-turn: still true
  const car = makeCarModel({ x: 46, station: si, tool });
  car.callId = tid;
  CARS[tid] = car; WORLD.cars.push(car); TURN.spawned++;
  SCENE.mountLaneCar(car);
  HUD.dirty = true; HUD.sessDirty = true;
  return car;
}

function finishCallCar(tid, ok, ms){
  const car = CARS[tid]; if (!car) return;
  delete CARS[tid];
  car.endedAt = Date.now();
  if (ok){
    car.grime = 0;                          // ITS call completed — that is the clean
    car.state = 'RINSE';                    // ride out through the blowers
    TURN.washed++; SESSION.washed++;
    WORLD.sparkleAt = CLOCK.now();
    RINGS.at(car.x, C.LANE_Y - 34);
    car.hop = 1;                            // the little hop of a job well done
  } else {
    car.state = 'REJECT';                   // no towel for a failed job
    TURN.failed++;
  }
  HUD.dirty = true;
}

// n-th car currently in `state` (or at stage `st`), for queueing offsets
function carSlot(car, pred){
  let k = 0;
  for (const o of WORLD.cars){ if (o === car) break; if (pred(o)) k++; }
  return k;
}


/* ── SVG KIT ─────────────────────────────────────────────────────── */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs){ if (attrs[k] != null) n.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, attrs){
  const n = el('text', Object.assign({ x, y }, attrs || {}), parent);
  n.textContent = s; return n;
}
const setA = (n, k, v) => { if (n.__c === undefined) n.__c = {}; if (n.__c[k] !== v){ n.__c[k] = v; n.setAttribute(k, v); } };

/* Eased opacity, exponential approach — the Material way: state changes are
   instant in the data (syncTruth still snaps its targets on the very frame
   the evidence arrives), and the PIXELS ease toward them. Lights warm up
   fast and cool down slower, like real lamps. Hidden tab: snap, no easing
   debt. */
const BLINK = {
  faces: [],
  reg(eyes){ if (eyes) this.faces.push({ eyes, at: 0, next: 1.5 + Math.random() * 4 }); },
  step(t){
    for (const f of this.faces){
      if (t > f.next){ f.at = t; f.next = t + 2.4 + Math.random() * 3.6; }
      const shut = (t - f.at) < .13;
      for (const e of f.eyes) setA(e, 'opacity', shut ? '0' : '1');
    }
  }
};

const FADE = {
  jobs: new Map(),
  to(node, target, k){
    let j = this.jobs.get(node);
    if (!j){
      j = { cur: parseFloat(node.getAttribute('opacity') || '0') || 0 };
      this.jobs.set(node, j);
    }
    j.target = target; j.k = k || 10;
  },
  step(dt, snap){
    for (const [n, j] of this.jobs){
      if (snap || REDUCED.matches) j.cur = j.target;
      else {
        j.cur += (j.target - j.cur) * Math.min(1, dt * j.k);
        if (Math.abs(j.cur - j.target) < .004) j.cur = j.target;
      }
      setA(n, 'opacity', j.cur.toFixed(3));
    }
  }
};

/* Confirmation rings — one expanding pulse at the car, on the frame its
   call really completed. The single most load-bearing moment gets the
   clearest motion. */
const RINGS = {
  pool: [], idx: 0,
  init(layer){
    for (let i = 0; i < 5; i++)
      this.pool.push({ n: el('circle', { r: 8, fill: 'none', stroke: '#7de8a6',
                                         'stroke-width': 2.5, opacity: 0 }, layer),
                       t: 9 });
  },
  at(x, y){
    if (REDUCED.matches || !this.pool.length) return;
    const r = this.pool[this.idx]; this.idx = (this.idx + 1) % this.pool.length;
    r.t = 0; r.x = x; r.y = y;
  },
  step(dt){
    for (const r of this.pool){
      if (r.t > .5){ if (r.n.__c && r.n.__c.opacity !== '0') setA(r.n, 'opacity', '0'); continue; }
      r.t += dt;
      const k = r.t / .5;
      setA(r.n, 'cx', r.x); setA(r.n, 'cy', r.y);
      setA(r.n, 'r', (8 + 46 * (1 - Math.pow(1 - k, 3))).toFixed(1));   // ease-out
      setA(r.n, 'opacity', (.85 * (1 - k)).toFixed(2));
    }
  }
};

/* ── PARTICLES — pooled; count is bounded regardless of load ─────── */
const P = {
  layer:null, pool:[], head:0,
  init(layer){
    this.layer = layer;
    for (let i = 0; i < C.POOL; i++){
      const n = el('circle', { r:2, fill:'#fff', opacity:0 }, layer);
      this.pool.push({ n, life:0, max:1, x:0, y:0, vx:0, vy:0, r:2, kind:'mist' });
    }
  },
  spawn(x, y, kind){
    if (REDUCED.matches) return;
    const p = this.pool[this.head]; this.head = (this.head + 1) % this.pool.length;
    p.x = x; p.y = y; p.kind = kind; p.life = 0;
    if (kind === 'mist'){  p.vx = rnd(-26,26);  p.vy = rnd(24,64);   p.max = rnd(.5,.9);  p.r = rnd(1.1,2.2); }
    if (kind === 'foam'){  p.vx = rnd(-16,16);  p.vy = rnd(-40,-12); p.max = rnd(.9,1.5); p.r = rnd(2.4,5.4); }
    if (kind === 'air'){   p.vx = rnd(70,190);  p.vy = rnd(-16,16);  p.max = rnd(.4,.7);  p.r = rnd(1.0,2.0); }
    if (kind === 'spark'){ p.vx = rnd(-58,58);  p.vy = rnd(-96,-26); p.max = rnd(.7,1.2); p.r = rnd(1.4,3.0); }
    if (kind === 'pour'){  p.vx = rnd(-8,8);    p.vy = rnd(260,400); p.max = rnd(.25,.45);p.r = rnd(1.4,2.4); }
    if (kind === 'fleck'){ p.vx = rnd(-150,150);p.vy = rnd(-140,-30);p.max = rnd(.35,.6); p.r = rnd(1.2,2.4); }
    setA(p.n, 'r', p.r.toFixed(2));
    setA(p.n, 'fill', kind === 'foam' ? '#f2f8ff' : kind === 'spark' ? '#ffe9a8'
                    : kind === 'air'  ? '#cfe3ff' : kind === 'fleck' ? '#dfe9f5' : '#4fb2ff');
  },
  step(dt){
    for (const p of this.pool){
      if (p.life >= p.max){ if (p.n.__c && p.n.__c.opacity !== '0') setA(p.n, 'opacity', '0'); continue; }
      p.life += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind !== 'foam' && p.kind !== 'air') p.vy += 190 * dt;
      if (p.kind === 'foam') p.vx *= (1 - 1.4 * dt);
      const k = 1 - p.life / p.max;
      setA(p.n, 'cx', p.x.toFixed(1)); setA(p.n, 'cy', p.y.toFixed(1));
      setA(p.n, 'opacity', (k * (p.kind === 'foam' ? .85 : .7)).toFixed(2));
    }
  }
};

/* ── SCENE — drawn once, then only mutated ───────────────────────── */
const SCENE = {
  svg:null, defs:null, layers:{}, stationRigs:[], zoneRigs:[], bayRigs:[], addonRigs:{},
  marquee:null,
  build(){
    const s = this.svg = document.getElementById('scene');
    while (s.firstChild) s.removeChild(s.firstChild);
    this.defs = el('defs', {}, s);
    this.gradients();

    const root = el('g', { 'clip-path':'url(#clipStage)' }, s);
    this.layers.bg      = el('g', {}, root);
    this.layers.tunnel  = el('g', {}, root);
    this.layers.laneCar = el('g', {}, root);
    this.layers.jets    = el('g', {}, root);
    this.layers.crew    = el('g', {}, root);
    this.layers.bays    = el('g', {}, root);
    this.layers.parts   = el('g', {}, root);
    this.layers.fx      = el('g', {}, root);

    this.drawSky();
    this.drawMarquee();
    this.drawTunnel();
    this.drawBays();
    this.drawThought();
    P.init(this.layers.parts);
    RINGS.init(this.layers.fx);
    // staggered reveal on load — scenery only, no lamps, nothing pretending
    // to be activity
    if (!REDUCED.matches)
      ['tunnel', 'bays', 'crew', 'laneCar'].forEach((k, i) => {
        setA(this.layers[k], 'opacity', '0');
        FADE.to(this.layers[k], 1, 3.4 - i * 0.55);
      });
  },

  /* Thinking is the complement of "a call is in flight" inside an open turn.
     Claude is reasoning, or writing its reply — the stream cannot tell those
     apart, so the bubble says "thinking", never what about. */
  drawThought(){
    const g = el('g', { opacity:0 }, this.layers.fx);
    el('rect', { x:-56, y:-38, width:112, height:38, rx:17, fill:'#0d1626',
                 stroke:'#2b3b57' }, g);
    el('circle', { cx:-38, cy:8, r:5, fill:'#0d1626', stroke:'#2b3b57' }, g);
    el('circle', { cx:-48, cy:17, r:3, fill:'#0d1626', stroke:'#2b3b57' }, g);
    const dots = [];
    for (let k = 0; k < 3; k++)
      dots.push(el('circle', { cx:-16 + k * 16, cy:-25, r:3.4, fill:'#7c8ca8' }, g));
    const cap = txt(g, 0, -8, '', { fill:'#4b5a75', 'font-size':8.5, 'text-anchor':'middle' });
    this.thought = { g, dots, cap };
  },

  gradients(){
    const sky = el('linearGradient', { id:'gSky', x1:0, y1:0, x2:0, y2:1 }, this.defs);
    el('stop', { offset:'0%',   'stop-color':'#16294d' }, sky);
    el('stop', { offset:'100%', 'stop-color':'#070c16' }, sky);

    const floor = el('linearGradient', { id:'gFloor', x1:0, y1:0, x2:0, y2:1 }, this.defs);
    el('stop', { offset:'0%',   'stop-color':'#1b2740' }, floor);
    el('stop', { offset:'100%', 'stop-color':'#0a1120' }, floor);

    const glow = el('radialGradient', { id:'gGlow' }, this.defs);
    el('stop', { offset:'0%',   'stop-color':'#3fd8ff', 'stop-opacity':'.55' }, glow);
    el('stop', { offset:'100%', 'stop-color':'#3fd8ff', 'stop-opacity':'0' }, glow);

    const warm = el('radialGradient', { id:'gWarm' }, this.defs);
    el('stop', { offset:'0%',   'stop-color':'#ffd98a', 'stop-opacity':'.15' }, warm);
    el('stop', { offset:'100%', 'stop-color':'#ffd98a', 'stop-opacity':'0' }, warm);

    const neon = el('filter', { id:'fNeon', x:'-40%', y:'-80%', width:'180%', height:'320%' }, this.defs);
    el('feGaussianBlur', { stdDeviation:5, result:'b' }, neon);
    const mg = el('feMerge', {}, neon);
    el('feMergeNode', { in:'b' }, mg); el('feMergeNode', { in:'SourceGraphic' }, mg);

    const soft = el('filter', { id:'fSoft', x:'-50%', y:'-50%', width:'200%', height:'200%' }, this.defs);
    el('feGaussianBlur', { stdDeviation:9 }, soft);

    /* grime: mottled mud with drip streaks — deliberately unattractive */
    const pat = el('pattern', { id:'pGrime', width:16, height:16, patternUnits:'userSpaceOnUse' }, this.defs);
    el('rect', { width:16, height:16, fill:'#4a3c28' }, pat);
    for (const c of [[3,4,3.0],[11,9,3.6],[7,2,1.9],[14,3,1.5],[2,12,2.4],[10,14,1.7],[6,8,1.4]])
      el('circle', { cx:c[0], cy:c[1], r:c[2], fill:'#2b2114', opacity:'.85' }, pat);
    for (const d of [[1,0,1.6,9],[8,4,1.2,11],[13,0,1.4,7]])
      el('rect', { x:d[0], y:d[1], width:d[2], height:d[3], rx:.7, fill:'#332716',
                   opacity:'.7' }, pat);

    /* one clip PER BODY KIND, in local car space — the gleam sweep must hug
       this car's silhouette, not the tallest cabin in the fleet */
    for (const kind of KINDS.concat(EXOTICS)){
      const ccb = el('clipPath', { id:'clipCarBody-' + kind }, this.defs);
      if (BODY[kind]) el('path', { d: BODY[kind] }, ccb);
      else el('rect', { x:4, y:24, width:122, height:23, rx:8 }, ccb);
      el('path', { d: CABIN[kind] }, ccb);
    }
    /* and one hard clip of the whole stage, so departing cars never render
       across the letterbox margin outside the viewBox */
    const cst = el('clipPath', { id:'clipStage' }, this.defs);
    el('rect', { x:0, y:0, width:C.VB_W, height:C.VB_H }, cst);
  },

  drawSky(){

  drawMarquee(){

  /* Equipment per station. Each one is a different silhouette on purpose: at a
     glance the shape, not the label, should tell you which step is running. */
  gearFor(kind, st, gear){
    const cx = st.cx, fx = [];
    const tagFx = (n, o) => { n.__fxo = o; fx.push(n); return n; };
    if (kind === 'pipes'){                                  // stage 1 · WATER POUR
      // overhead supply pipe, four nozzles; the streams exist only while live
      el('rect', { x:st.x0 + 26, y:136, width:C.STATION_W - 52, height:10, rx:5, fill:'#33465f' }, gear);
      el('rect', { x:st.x0 + 26, y:130, width:16, height:8, rx:3, fill:'#4a5b78' }, gear);
      st.nozzles = [];
      for (const dx of [-80, -27, 27, 80]){
        el('path', { d:`M${cx+dx-7},146 L${cx+dx+7},146 L${cx+dx+4},158 L${cx+dx-4},158 Z`, fill:'#7d8fa8' }, gear);
        tagFx(el('rect', { x:cx + dx - 3.2, y:158, width:6.4, height:196, rx:3,
                           fill:'#4fb2ff', opacity:0 }, gear), '.6');
        st.nozzles.push(cx + dx);
      }
      tagFx(el('ellipse', { cx, cy:C.LANE_Y - 3, rx:98, ry:7, fill:'#4fb2ff', opacity:0 }, gear), '.4');
    } else if (kind === 'cannon'){                          // stage 2 · SOAP & FOAM
      const cols = ['#ff7ad9', '#7ad9ff', '#f2f8ff'];
      cols.forEach((c, k) => {
        const dx = -66 + k * 66;
        el('rect', { x:cx + dx - 9, y:132, width:18, height:32, rx:4, fill:'#33465f' }, gear);
        el('rect', { x:cx + dx - 9, y:132, width:18, height:8, rx:4, fill:c, opacity:.9 }, gear);
        el('path', { d:`M${cx+dx-5},164 L${cx+dx+5},164 L${cx+dx+3},176 L${cx+dx-3},176 Z`, fill:'#7d8fa8' }, gear);
        tagFx(el('path', { d:`M${cx+dx-4},176 L${cx+dx+4},176 L${cx+dx+32},332 L${cx+dx-32},332 Z`,
                           fill:c, opacity:0 }, gear), '.26');
      });
    } else if (kind === 'rollers'){                         // stage 3 · ROLLERS
      // two side brushes + a top roller riding just above the roof line
      st.brushes = [];
      [cx - 86, cx + 86].forEach((bx, k) => {
        const clipId = 'clipBr' + st.i + k;
        el('rect', { x:bx - 20, y:170, width:40, height:190, rx:20 },
           el('clipPath', { id:clipId }, this.defs));
        el('rect', { x:bx - 20, y:170, width:40, height:190, rx:20, fill:'#22314e' }, gear);
        const stripes = el('g', { 'clip-path':'url(#' + clipId + ')' }, gear);
        for (let q = 0; q < 10; q++)
          el('rect', { x:bx - 20, y:148 + q * 22, width:40, height:9, rx:4.5,
                       fill:'#8fb7d9', opacity:.5 }, stripes);
        el('rect', { x:bx - 3, y:140, width:6, height:34, fill:'#4a5b78' }, gear);
        st.brushes.push({ stripes });
      });
      const topId = 'clipTop' + st.i;
      el('rect', { x:cx - 58, y:300, width:116, height:44, rx:22 },
         el('clipPath', { id:topId }, this.defs));
      const top = el('g', {}, gear);
      for (const dx of [-44, 44])
        el('rect', { x:cx + dx - 3, y:120, width:6, height:184, fill:'#4a5b78' }, top);
      el('rect', { x:cx - 58, y:300, width:116, height:44, rx:22, fill:'#22314e' }, top);
      const tstripes = el('g', { 'clip-path':'url(#' + topId + ')' }, top);
      for (let q = 0; q < 8; q++)
        el('rect', { x:cx - 62 + q * 18, y:300, width:8, height:44, rx:4,
                     fill:'#8fb7d9', opacity:.5 }, tstripes);
      st.topRoller = { g: top, stripes: tstripes };
    } else {                                                // stage 4 · AIR DRY
      for (const dx of [-72, -6, 60]){
        el('rect', { x:cx + dx - 16, y:134, width:56, height:26, rx:7, fill:'#33465f' }, gear);
        el('path', { d:`M${cx+dx-6},160 L${cx+dx+10},160 L${cx+dx+16},178 L${cx+dx-12},178 Z`, fill:'#4a5b78' }, gear);
      }
      st.streaks = [];
      for (let k = 0; k < 6; k++)
        st.streaks.push(tagFx(el('rect', { x:st.x0 + 18, y:238 + k * 24, width:64, height:3,
                                           rx:1.5, fill:'#cfe3ff', opacity:0 }, gear), '.35'));
    }
    st.fx = fx;
  },

  drawTunnel(){

      const gear = el('g', {}, bay);

      /* Helper slot: a washer appears here only while THIS step is running.

         the step the car is parked at must stand in FRONT of the car, or the
         one member of the crew you most want to see is the one hidden. */
      const helper = el('g', { opacity:0 }, this.layers.crew);

      BLINK.reg(wr.eyes);
      wr.g.setAttribute('transform', 'translate(' + (st.cx - 96) + ',' + C.LANE_Y + ')');
      helper.appendChild(wr.g);

      /* label plate */
      el('rect', { x:st.x0 + 4, y:C.LANE_Y + 22, width:C.STATION_W - 8, height:36, rx:5,
                   fill:'#0b1220', stroke:'#1e2c48' }, bay);
      el('rect', { x:st.x0 + 4, y:C.LANE_Y + 22, width:C.STATION_W - 8, height:1.3,

    this.drawZone(ZONES.BYE);

  drawBays(){

                                   opacity:0, filter:'url(#fSoft)' }, bg);
      const idle = txt(bg, b.cx, b.y + 58, 'empty', { fill:'#22314e', 'font-size':10,
            'text-anchor':'middle', 'letter-spacing':1.8 });
      const who  = txt(bg, b.cx, b.y + 22, '', { fill:'#8fa2bd', 'font-size':9, 'text-anchor':'middle',
            'font-weight':700 });
      const what = txt(bg, b.cx, b.y + 33, '', { fill:'#4b5a75', 'font-size':8, 'text-anchor':'middle' });
      /* which of the four stages this subagent is on — the tunnel's vocabulary */
      const stepBox = el('rect', { x:b.cx - 52, y:b.y + b.h - 16, width:104, height:13, rx:4,
                                   fill:'#0d1626', stroke:'#1a2640', opacity:0 }, bg);
      const step = txt(bg, b.cx, b.y + b.h - 6.5, '', { fill:'#8fa2bd', 'font-size':7.5,

      const crew = el('g', {}, bg);
      this.bayRigs.push({ b, lamp, halo, pool, idle, who, what, step, stepBox,
