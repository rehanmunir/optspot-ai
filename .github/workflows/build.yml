# Build OPTSPOT AI for macOS (Apple Silicon + Intel) and Windows (x64).
#
# A Windows installer cannot be cross-compiled from macOS (MSVC + NSIS live
# only on Windows), so CI is where the Windows build genuinely comes from.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
# Artifacts: .dmg / .app (mac), NSIS .exe + .msi (windows), attached to a
# draft GitHub release when the ref is a tag, otherwise uploaded as artifacts.

name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # Apple Silicon
            target: aarch64-apple-darwin
          - platform: macos-latest          # Intel
            target: x86_64-apple-darwin
          - platform: windows-latest        # x64 NSIS + MSI
            target: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The desktop app spawns the bundled Python server at runtime; the
      # runners have Python, and end users need it installed (README).
      - name: install frontend deps
        working-directory: desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          # on a tag: draft release with all installers attached
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('OPTSPOT AI {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: upload artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: optspot-ai-${{ matrix.platform }}-${{ matrix.target || 'x64' }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app/**
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: warn
